openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Hedge Fund Research Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: AI research analysis operations
  - name: hypotheses
    description: Investment hypothesis tracking
  - name: market-data
    description: Real-time and historical market data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analysis:
    post:
      operationId: startAnalysis
      tags: [analysis]
      summary: Start a new AI research analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAnalysisRequest"
      responses:
        "200":
          description: Analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
    get:
      operationId: listAnalyses
      tags: [analysis]
      summary: List all analyses
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"

  /analysis/{id}:
    get:
      operationId: getAnalysis
      tags: [analysis]
      summary: Get a specific analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/{id}/step:
    post:
      operationId: runAnalysisStep
      tags: [analysis]
      summary: Run next analysis step for a given analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStepRequest"
      responses:
        "200":
          description: Step result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStep"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hypotheses:
    get:
      operationId: listHypotheses
      tags: [hypotheses]
      summary: List all investment hypotheses
      responses:
        "200":
          description: List of hypotheses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hypothesis"
    post:
      operationId: createHypothesis
      tags: [hypotheses]
      summary: Create an investment hypothesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHypothesisRequest"
      responses:
        "200":
          description: Created hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hypothesis"

  /hypotheses/{id}:
    patch:
      operationId: updateHypothesis
      tags: [hypotheses]
      summary: Update hypothesis with actual price/outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHypothesisRequest"
      responses:
        "200":
          description: Updated hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hypothesis"

  /market-data/{ticker}:
    get:
      operationId: getMarketData
      tags: [market-data]
      summary: Get historical market data with technical indicators
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          description: Ticker symbol (e.g. 078160.KS, AAPL)
        - name: period
          in: query
          schema:
            type: string
            enum: ["3m", "6m", "1y", "2y", "5y"]
            default: "1y"
        - name: interval
          in: query
          schema:
            type: string
            enum: ["1d", "1wk", "1mo"]
            default: "1d"
      responses:
        "200":
          description: Market data with technical indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketData"
        "404":
          description: Ticker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    StartAnalysisRequest:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol (e.g. 005930, AAPL)
        companyName:
          type: string
          description: Company name (auto-fetched if omitted)
        industry:
          type: string
          description: Industry/sector (auto-fetched if omitted)
        additionalContext:
          type: string
          description: Additional context or focus areas for analysis
      required:
        - ticker

    RunStepRequest:
      type: object
      properties:
        stepKey:
          type: string
          description: Which analysis step to run
          enum:
            - industry_structure
            - macro
            - fundamental
            - valuation
            - market_microstructure
            - technical
            - catalyst
            - smart_money
            - lead_validation
      required:
        - stepKey

    AnalysisStep:
      type: object
      properties:
        id:
          type: integer
        analysisId:
          type: integer
        stepKey:
          type: string
        agentName:
          type: string
        agentRole:
          type: string
        content:
          type: string
        validationNotes:
          type: string
        informationType:
          type: string
          enum: [confirmed_fact, data_based_estimate, hypothesis]
        createdAt:
          type: string
      required:
        - id
        - analysisId
        - stepKey
        - agentName
        - agentRole
        - content
        - informationType
        - createdAt

    Analysis:
      type: object
      properties:
        id:
          type: integer
        ticker:
          type: string
        companyName:
          type: string
        industry:
          type: string
        additionalContext:
          type: string
        status:
          type: string
          enum: [in_progress, completed]
        currentStep:
          type: string
        investmentVerdict:
          type: string
        targetPrice:
          type: number
        entryPrice:
          type: number
        stopLoss:
          type: number
        riskRewardRatio:
          type: number
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisStep"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - ticker
        - companyName
        - industry
        - status
        - steps
        - createdAt
        - updatedAt

    CreateHypothesisRequest:
      type: object
      properties:
        analysisId:
          type: integer
        ticker:
          type: string
        companyName:
          type: string
        hypothesisText:
          type: string
        targetPrice:
          type: number
        entryPrice:
          type: number
        timeHorizon:
          type: string
        catalysts:
          type: string
        risks:
          type: string
      required:
        - ticker
        - companyName
        - hypothesisText
        - targetPrice
        - entryPrice

    UpdateHypothesisRequest:
      type: object
      properties:
        actualPrice:
          type: number
        outcome:
          type: string
          enum: [pending, hit_target, hit_stoploss, expired, ongoing]
        notes:
          type: string

    Hypothesis:
      type: object
      properties:
        id:
          type: integer
        analysisId:
          type: integer
        ticker:
          type: string
        companyName:
          type: string
        hypothesisText:
          type: string
        targetPrice:
          type: number
        entryPrice:
          type: number
        actualPrice:
          type: number
        timeHorizon:
          type: string
        catalysts:
          type: string
        risks:
          type: string
        outcome:
          type: string
          enum: [pending, hit_target, hit_stoploss, expired, ongoing]
        accuracyScore:
          type: number
        notes:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - ticker
        - companyName
        - hypothesisText
        - targetPrice
        - entryPrice
        - outcome
        - createdAt
        - updatedAt

    Candle:
      type: object
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
        rsi:
          type: number
          nullable: true
        ma20:
          type: number
          nullable: true
        ma60:
          type: number
          nullable: true
        ma120:
          type: number
          nullable: true
        bbUpper:
          type: number
          nullable: true
        bbMiddle:
          type: number
          nullable: true
        bbLower:
          type: number
          nullable: true
      required:
        - date
        - open
        - high
        - low
        - close
        - volume

    MarketQuoteInfo:
      type: object
      properties:
        longName:
          type: string
          nullable: true
        marketCap:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        averageVolume:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true

    MarketData:
      type: object
      properties:
        ticker:
          type: string
        quoteInfo:
          $ref: "#/components/schemas/MarketQuoteInfo"
          nullable: true
        currentPrice:
          type: number
        changePercent:
          type: number
        yearHigh:
          type: number
        yearLow:
          type: number
        currentRsi:
          type: number
          nullable: true
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
      required:
        - ticker
        - currentPrice
        - changePercent
        - yearHigh
        - yearLow
        - candles
