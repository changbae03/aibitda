kind = "mobile"
previewPath = "/cbst-mobile/"
title = "CBST 모바일"
version = "1.0.0"
id = "artifacts/cbst-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/cbst-mobile/" ]
localPort = 19956

[services.development]
run = "pnpm --filter @workspace/cbst-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cbst-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cbst-mobile", "run", "serve" ]

[services.env]
PORT = "19956"
BASE_PATH = "/cbst-mobile/"
