    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #111111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #splash-title {
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 3rem;
        font-weight: 700;
        color: #FF8A7A;
        letter-spacing: -0.02em;
        animation: splashPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      #splash-sub {
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 0.75rem;
        color: rgba(255,255,255,0.45);
        margin-top: 0.5rem;
        letter-spacing: 0.05em;
        opacity: 0;
        animation: splashFade 0.45s ease-out 0.35s forwards;
      }
      #splash.hiding {
        animation: splashOut 0.55s ease-in-out forwards;
      }
      @keyframes splashPop {
        from { opacity: 0; transform: scale(0.78); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes splashFade {
        from { opacity: 0; transform: translateY(5px); }
        to   { opacity: 0.45; transform: translateY(0); }
      }
      @keyframes splashOut {
        from { opacity: 1; }
        to   { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <!-- 네이티브 스플래시: React보다 먼저 즉시 렌더링 -->
    <div id="splash">
      <span id="splash-title">애빛다</span>
      <span id="splash-sub">AI로 기업가치를 밝히다</span>
    </div>

    <script>
      (function() {
        var splash = document.getElementById('splash');
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches
          || navigator.standalone === true;
        var shown = sessionStorage.getItem('splash-shown');

        if (!isStandalone || shown) {
          // PWA 아닐 때 또는 이미 본 세션이면 즉시 숨김
          splash.style.display = 'none';
          return;
        }

        // 2초 후 페이드아웃
        setTimeout(function() {
          splash.classList.add('hiding');
          setTimeout(function() {
            splash.style.display = 'none';
          }, 560);
        }, 2000);

        sessionStorage.setItem('splash-shown', '1');
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
