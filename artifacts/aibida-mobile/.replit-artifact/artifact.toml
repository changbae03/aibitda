kind = "mobile"
previewPath = "/aibida-mobile/"
title = "애빛다 Mobile"
version = "1.0.0"
id = "artifacts/aibida-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/aibida-mobile/" ]
localPort = 23339

[services.development]
run = "pnpm --filter @workspace/aibida-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aibida-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aibida-mobile", "run", "serve" ]

[services.env]
PORT = "23339"
BASE_PATH = "/aibida-mobile/"
